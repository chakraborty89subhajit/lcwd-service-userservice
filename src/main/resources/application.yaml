
server:
  port: 8081

spring:
  application:
    name: userservice
  #profiles:
    #active: dev
  datasource:
    url: jdbc:mysql://localhost:3306/microservice
    username: root
    password: project
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
      show-sql: true
    properties:
     hibernate:
       dialect: org.hibernate.dialect.MySQL8Dialect

  config:
      import: "optional:configserver:http://localhost:8085"


