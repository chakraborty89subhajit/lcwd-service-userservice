server:
  port: 8081

management:
  health:
    circuitbreakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

resilience4j:
  circuitbreaker:
    instances:
      ratingHotelBreaker:
        registerHealthIndicator: true
        eventConsumerBufferSize: 10
        failureRateThreshold: 50

        minimumNumberOfCalls: 1      #CHANGED (was 5)

        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 6s
        permittedNumberOfCallsInHalfOpenState: 3

        slidingWindowSize: 2          #CHANGED (was 10)
        slidingWindowType: COUNT_BASED

  retry:
    instances:
      ratingHotelService:
        maxAttampts: 3
        waitDuration: 5s

spring:
  application:
    name: userservice
    #profiles:
    #active: dev
  datasource:
    url: jdbc:mysql://localhost:3306/microservice
    username: root
    password: project
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  config:
    import: "optional:configserver:http://localhost:8085"

